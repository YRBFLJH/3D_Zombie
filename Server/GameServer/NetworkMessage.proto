syntax = "proto3";

package game;

message JoinRequest {}

message LeaveRequest {}          // 主动离开消息

message AssignId {
    int32 id = 1;
    bool ishost = 2; // 是否是主机
}

// 主机切换通知
message HostNotify {
    int32 hostid = 1; // 新主机ID
}

// AI状态同步消息（单条）
message EnemyStateSync {
    int32 enemyId = 1;
    float posX = 2;
    float posY = 3;
    float posZ = 4;
    float rotY = 5;
    float speed = 6;
    int32 state = 7;
    bool isDead = 8;
    bool isAttack = 9;
}

// 批量AI状态同步
message EnemyStateSyncBatch {
    repeated EnemyStateSync enemy_states = 1;
}

message Input {
    int32 id = 1;
    float moveX = 2;
    float moveZ = 3;
    float rotY = 4;
    bool running = 5;
    bool aiming = 6;
}

// 玩家状态同步（客户端上报自身真实状态，服务端只负责转发/广播）
message PlayerTransformSync {
    int32 id = 1;
    float posX = 2;
    float posY = 3;
    float posZ = 4;
    float rotY = 5;
    float speed = 6;
    bool running = 7;
    bool aiming = 8;
    bool armed = 9;
    float lookDirX = 10;
    float lookDirY = 11;
    float lookDirZ = 12;
}

// 射击事件同步（用于远端播放开火表现）
message ShootEvent {
    int32 shooterId = 1;
    float firePosX = 2;
    float firePosY = 3;
    float firePosZ = 4;
    float dirX = 5;
    float dirY = 6;
    float dirZ = 7;
    float damage = 8;
}

// 非主机命中敌人时上报主机处理伤害（主机权威AI）
message EnemyHitEvent {
    int32 attackerId = 1;
    int32 enemyId = 2;
    float damage = 3;
}

// ---------- 箱子库存同步（服务端权威，广播一致状态）----------

message ChestItemState {
    int32 itemId = 1;
    int32 amount = 2;
    int32 x = 3;
    int32 y = 4;
    string gridType = 5;
    int32 gridIndex = 6;
    bool rotated = 7;
}

// 客户端向服务端请求当前箱子快照（进入范围/打开 UI 前）
message ChestStateRequest {
    int32 playerId = 1;
    int32 chestId = 2;
}

// 客户端提交完整箱子物品列表（本地变更后上传）
message ChestStateSubmit {
    int32 playerId = 1;
    int32 chestId = 2;
    repeated ChestItemState items = 3;
}

// 服务端广播箱子快照给所有客户端
message ChestStateSync {
    int32 chestId = 1;
    repeated ChestItemState items = 2;
    int32 fromPlayerId = 3; // 0 表示来自服务端拉取应答
}

// ---------- 服务端权威：射击与伤害 ----------

// 客户端请求开火（仅表达意图，不造成伤害）
message ShootRequest {
    int32 shooterId = 1;
    float firePosX = 2;
    float firePosY = 3;
    float firePosZ = 4;
    float dirX = 5;
    float dirY = 6;
    float dirZ = 7;
}

// 服务端确认命中结果（服务端计算伤害后广播）
message HitResult {
    int32 targetType = 1;  // 0=敌人, 1=玩家
    int32 targetId = 2;
    float damage = 3;
    float remainingHP = 4;
    int32 attackerId = 5;
}

// ---------- 服务端权威：玩家属性 ----------

message PlayerStatsSync {
    int32 id = 1;
    float hp = 2;
    float maxHp = 3;
    float food = 4;
    float water = 5;
    bool isDead = 6;
}

message PlayerDeath {
    int32 playerId = 1;
}

message PlayerRespawn {
    int32 playerId = 1;
    float posX = 2;
    float posY = 3;
    float posZ = 4;
}

// ---------- 服务端权威：敌人与波次 ----------

message EnemySpawn {
    int32 enemyId = 1;
    int32 enemyType = 2;
    float posX = 3;
    float posY = 4;
    float posZ = 5;
    float rotY = 6;
}

message EnemyDespawn {
    int32 enemyId = 1;
    int32 reason = 2;  // 0=被击杀, 1=波次结束, 2=清理
}

message WaveSync {
    int32 currentWave = 1;
    int32 enemiesRemaining = 2;
    int32 waveState = 3;  // 0=等待中, 1=战斗中, 2=休息中, 3=已完成
}

message PlayerState {
    int32 id = 1;
    float posX = 2;
    float posY = 3;
    float posZ = 4;
    float rotY = 5;
    float speed = 6;
    bool isRunning = 7;
    bool isAiming = 8;
    bool isArmed = 9;
    float lookDirX = 10;
    float lookDirY = 11;
    float lookDirZ = 12;
}

message EnemyState {
    int32 enemyId = 1;
    float posX = 2;
    float posY = 3;
    float posZ = 4;
    float rotY = 5;
    float speed = 6;
    int32 state = 7;
    bool isDead = 8;
    bool isAttack = 9;
}

message WorldState {
    repeated PlayerState players = 1;
    repeated EnemyState enemies = 2;
}

// ---------- 房间大厅 ----------

message RoomInfo {
    int32 roomId = 1;
    string roomName = 2;
    int32 playerCount = 3;
    int32 maxPlayers = 4;
    bool inGame = 5;
}

message RoomListRequest {}
message RoomListResponse {
    repeated RoomInfo rooms = 1;
}

message CreateRoomRequest {
    string roomName = 1;
}
message CreateRoomResponse {
    bool success = 1;
    int32 roomId = 2;
    string error = 3;
}

message JoinRoomRequest {
    int32 roomId = 1;
}
message JoinRoomResponse {
    bool success = 1;
    int32 roomId = 2;
    string error = 3;
}

message LeaveRoomRequest {}
message LeaveRoomResponse {
    bool success = 1;
}

message StartGameRequest {}

message GameStartNotify {
    int32 roomId = 1;
}

// ---------- 存档系统 ----------

message PlayerSaveData {
    int32 player_id = 1;
    float pos_x = 2; float pos_y = 3; float pos_z = 4;
    float hp = 5; float max_hp = 6;
    float food = 7; float water = 8;
    int32 level = 9; int32 gold = 10;
    int32 equipped_head_id = 11;
    int32 equipped_body_id = 12;
    int32 equipped_weapon1_id = 13;
    int32 equipped_weapon2_id = 14;
    int32 equipped_weapon3_id = 15;
    repeated ChestItemState inventory_items = 16;
    int32 respawn_count = 17;
    int32 total_kills = 18;
}

message WorldSaveData {
    int32 room_id = 1;
    int32 current_wave = 2;
    float ai_pos_x = 3; float ai_pos_y = 4; float ai_pos_z = 5;
    float ai_hp = 6;
    int32 ai_state = 7;
    repeated ChestStateSync chests = 8;
}

message PlayerSaveSubmit {
    int32 player_id = 1;
    int32 room_id = 2;
    PlayerSaveData save_data = 3;
}
message PlayerSaveAck { bool success = 1; }

message WorldSaveSubmit {
    int32 player_id = 1;
    int32 room_id = 2;
    WorldSaveData save_data = 3;
}
message WorldSaveAck { bool success = 1; }

message DeleteRoomRequest {
    int32 player_id = 1;
    int32 room_id = 2;
}
message DeleteRoomResponse { bool success = 1; }

// ---------- 登录注册 ----------

message LoginRequest {
    string account = 1;
    string password = 2;
}

message RegisterRequest {
    string account = 1;
    string password = 2;
}

message LoginResponse {
    bool success = 1;
    string error = 2;
    int32 player_id = 3;
}

message GameMessage {
    oneof payload {
        JoinRequest join_request = 1;
        AssignId assign_id = 2;
        Input input = 3;
        WorldState world_state = 4;
        LeaveRequest leave_request = 5;
        HostNotify host_notify = 6;
        EnemyStateSync enemy_state_sync = 7;
        EnemyStateSyncBatch enemy_state_sync_batch = 8;
        PlayerTransformSync player_transform_sync = 9;
        ShootEvent shoot_event = 10;
        EnemyHitEvent enemy_hit_event = 11;
        ChestStateRequest chest_state_request = 12;
        ChestStateSubmit chest_state_submit = 13;
        ChestStateSync chest_state_sync = 14;
        ShootRequest shoot_request = 15;
        HitResult hit_result = 16;
        PlayerStatsSync player_stats_sync = 17;
        PlayerDeath player_death = 18;
        PlayerRespawn player_respawn = 19;
        EnemySpawn enemy_spawn = 20;
        EnemyDespawn enemy_despawn = 21;
        WaveSync wave_sync = 22;
        RoomListRequest room_list_request = 23;
        RoomListResponse room_list_response = 24;
        CreateRoomRequest create_room_request = 25;
        CreateRoomResponse create_room_response = 26;
        JoinRoomRequest join_room_request = 27;
        JoinRoomResponse join_room_response = 28;
        LeaveRoomRequest leave_room_request = 29;
        LeaveRoomResponse leave_room_response = 30;
        StartGameRequest start_game_request = 31;
        GameStartNotify game_start_notify = 32;
        PlayerSaveSubmit player_save_submit = 33;
        PlayerSaveAck player_save_ack = 34;
        WorldSaveSubmit world_save_submit = 35;
        WorldSaveAck world_save_ack = 36;
        DeleteRoomRequest delete_room_request = 37;
        DeleteRoomResponse delete_room_response = 38;
        LoginRequest login_request = 39;
        LoginResponse login_response = 40;
        RegisterRequest register_request = 41;
    }
}